<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 가족의 만들기 준비 요청서</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #222; font-family: 'Malgun Gothic', sans-serif; }
    main { max-width: 210mm; margin: auto; padding: 12mm; }
    h1 { margin: 0 0 3mm; font-size: 22pt; }
    p { margin: 2mm 0; font-size: 11pt; }
    .note { margin: 4mm 0; padding: 3mm; background: #f1f5f9; border-radius: 3mm; }
    h2 { margin: 5mm 0 2mm; font-size: 14pt; }
    .line { border-bottom: 1px solid #777; height: 9mm; }
    .drawing { height: 105mm; border: 2px solid #555; border-radius: 3mm; padding: 3mm; color: #666; font-size: 10pt; }
    button { display: block; margin: 15px auto; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    @page { size: A4; margin: 8mm; }
    @media print { main { padding: 0; } button { display: none; } }
  </style>
</head>
<body>
  <button type="button" onclick="window.print()">학습지 인쇄하기</button>
  <main>
    <h1>우리 가족의 만들기 준비 요청서</h1>
    <p>아이가 생각하고 그려요. 어른은 이야기를 듣고 글을 도와줘요.</p>
    <p class="note">이름, 학교, 전화번호, 사진은 적지 않아요.</p>
    <h2>1. 무엇을 만들고 싶나요?</h2>
    <div class="line"></div>
    <h2>2. 어떤 모습인가요? 어떻게 움직이나요?</h2>
    <div class="drawing">그림을 그리고, 화살표나 말풍선으로 설명해요.</div>
    <h2>3. 꼭 들어가면 좋은 것은 무엇인가요?</h2>
    <div class="line"></div>
    <h2>4. 발표할 때 소개하고 싶은 것은?</h2>
    <div class="line"></div>
  </main>
</body>
</html>
